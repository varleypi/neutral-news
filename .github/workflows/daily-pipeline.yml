name: Daily Article Generation

# Primary trigger: SpinDetector's pipeline fires a repository_dispatch the moment
# it finishes populating today's clusters (event type: spindetector-updated).
# The daily schedule below is a backup in case that chained trigger is missed.
on:
  repository_dispatch:
    types: [spindetector-updated]
  schedule:
    - cron: '0 13 * * *'   # backup — SpinDetector normally triggers us ~3h earlier
  workflow_dispatch:
    inputs:
      pipeline_date:
        description: 'Date to run for (YYYY-MM-DD). Defaults to today.'
        required: false
      dry_run:
        description: 'Dry run: exercise the full pipeline but store, deploy and post nothing.'
        type: boolean
        default: false
      max_clusters:
        description: 'Stop after this many candidate clusters (blank = no cap). Keeps a pilot cheap.'
        required: false
      probe_only:
        description: 'Run the cheap probes (~2 API calls) instead of the pipeline.'
        type: boolean
        default: false

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci

      # The probes live in their own workflow (probe.yml), but GitHub will only
      # dispatch a workflow that exists on the default branch, so until this
      # branch merges they can only be reached from here. Remove this step once
      # probe.yml is on master.
      - name: Run probes instead of the pipeline
        if: ${{ github.event.inputs.probe_only == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node pipeline/probe.js

      - name: Run article generation pipeline
        if: ${{ github.event.inputs.probe_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SPINDETECTOR_SUPABASE_URL: ${{ secrets.SPINDETECTOR_SUPABASE_URL }}
          SPINDETECTOR_SUPABASE_SERVICE_KEY: ${{ secrets.SPINDETECTOR_SUPABASE_SERVICE_KEY }}
          NEUTRAL_NEWS_SUPABASE_URL: ${{ secrets.NEUTRAL_NEWS_SUPABASE_URL }}
          NEUTRAL_NEWS_SUPABASE_SERVICE_KEY: ${{ secrets.NEUTRAL_NEWS_SUPABASE_SERVICE_KEY }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          # OAuth 1.0a user tokens for the @NeutralNews X account's own developer
          # app — separate credentials from SpinDetector's, so the two sites post
          # from two different accounts.
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          PIPELINE_DATE: ${{ github.event.inputs.pipeline_date || '' }}
          # Both are only ever set by a manual dispatch; the scheduled and
          # chained runs leave them empty and publish as normal.
          PIPELINE_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
          PIPELINE_MAX_CLUSTERS: ${{ github.event.inputs.max_clusters || '' }}
        run: node pipeline/run.js
