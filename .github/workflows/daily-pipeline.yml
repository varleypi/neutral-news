name: Daily Article Generation

# Primary trigger: SpinDetector's pipeline fires a repository_dispatch the moment
# it finishes populating today's clusters (event type: spindetector-updated).
# The daily schedule below is a backup in case that chained trigger is missed.
on:
  repository_dispatch:
    types: [spindetector-updated]
  schedule:
    - cron: '0 13 * * *'   # backup — SpinDetector normally triggers us ~3h earlier
  workflow_dispatch:
    inputs:
      pipeline_date:
        description: 'Date to run for (YYYY-MM-DD). Defaults to today.'
        required: false

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Run article generation pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SPINDETECTOR_SUPABASE_URL: ${{ secrets.SPINDETECTOR_SUPABASE_URL }}
          SPINDETECTOR_SUPABASE_SERVICE_KEY: ${{ secrets.SPINDETECTOR_SUPABASE_SERVICE_KEY }}
          NEUTRAL_NEWS_SUPABASE_URL: ${{ secrets.NEUTRAL_NEWS_SUPABASE_URL }}
          NEUTRAL_NEWS_SUPABASE_SERVICE_KEY: ${{ secrets.NEUTRAL_NEWS_SUPABASE_SERVICE_KEY }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          PIPELINE_DATE: ${{ github.event.inputs.pipeline_date || '' }}
        run: node pipeline/run.js
