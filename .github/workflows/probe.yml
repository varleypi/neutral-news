name: Pipeline Probe

# Cheap diagnostics for the expensive stages — about two model calls and a
# couple of minutes, against a fixed article with a known answer.
#
# This exists so that checking a config change never again means running the
# daily pipeline end to end. Deliberately has no Supabase, Vercel or X
# credentials: it cannot read clusters, store anything, deploy or post.
on:
  workflow_dispatch:
    inputs:
      probes:
        description: 'Which probes to run: gate, verify, grok, draft, corrections, schema (space-separated; blank = all).'
        required: false
      verifier_model:
        description: 'Override the verifier model, e.g. claude-sonnet-5. Blank = default.'
        required: false
      verify_max_searches:
        description: 'Override the verifier search budget. Blank = default (24).'
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: the test script globs test files and the lib suites are
          # TypeScript. Node 20 supports neither, so `npm test` there fails
          # before running a single test - which is how it failed the first
          # time this workflow ran. daily-pipeline.yml is still on 20; it runs
          # no tests, but the two should be aligned before long.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (free)
        run: npm test

      - name: Run probes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # So a cheaper configuration can be tried for one call instead of
          # being argued about, or worse, shipped and measured in production.
          CLAUDE_VERIFIER_MODEL: ${{ github.event.inputs.verifier_model }}
          VERIFY_MAX_SEARCHES: ${{ github.event.inputs.verify_max_searches }}
        run: node pipeline/probe.js ${{ github.event.inputs.probes }}
